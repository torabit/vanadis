[package]
name = "vanadis"
version = "0.3.1"
edition = "2024"
rust-version = "1.98"
description = "Build your CLI tool configs from one palette. Templates in, themed configs out."
repository = "https://github.com/torabit/vanadis"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["theme", "colorscheme", "dotfiles", "palette", "terminal"]
categories = ["command-line-utilities"]

# The crate is the binary and the library it is built from, plus the documents that decide how
# both behave and the tests that hold them to it. What is left out is how vanadis itself is
# built: the agent instructions and the CI workflow are of no use to anyone installing it.
exclude = [".claude/", ".github/", "CLAUDE.md"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.1.10"
saphyr = "0.0.12"
serde_json = "1.0.147"
similar = "3.2.0"
tar = "0.4.46"
thiserror = "2.0.18"
toml_edit = "0.25.13"
ureq = "3.4.1"

[dev-dependencies]
proptest = "1.11.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
