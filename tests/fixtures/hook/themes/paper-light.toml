[meta]
format = 1
name = "Paper Light"
variant = "light"

[colors]
bg = "#eeeeee"

# The core vocabulary, so `check` passes on this tree. Every token points at the one
# colour the templates read; what matters here is that the core is complete.
[role]
bg = "{{colors.bg}}"
fg = "{{colors.bg}}"
comment = "{{colors.bg}}"
keyword = "{{colors.bg}}"
string = "{{colors.bg}}"
error = "{{colors.bg}}"
ok = "{{colors.bg}}"
warn = "{{colors.bg}}"
visual = "{{colors.bg}}"
linenr = "{{colors.bg}}"
accent = "{{colors.bg}}"
accent-alt = "{{colors.bg}}"
accent-warm = "{{colors.bg}}"
inactive = "{{colors.bg}}"
border = "{{colors.bg}}"
selection-bg = "{{colors.bg}}"
hover-bg = "{{colors.bg}}"

[ansi]
0 = "{{colors.bg}}"
1 = "{{colors.bg}}"
2 = "{{colors.bg}}"
3 = "{{colors.bg}}"
4 = "{{colors.bg}}"
5 = "{{colors.bg}}"
6 = "{{colors.bg}}"
7 = "{{colors.bg}}"
8 = "{{colors.bg}}"
9 = "{{colors.bg}}"
10 = "{{colors.bg}}"
